<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Uploader</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem; }
        #crop-container { position: relative; width: 500px; height: 400px; overflow: hidden; border: 1px solid #ccc; }
        #crop-container img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #crop-frame { position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); cursor: move; }
        .controls, .results-container { display: flex; flex-direction: column; gap: 0.5rem; width: 500px; }
        #results { border: 1px solid #ccc; padding: 0.5rem; min-height: 50px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <h2>Fotoğraf Yükleme Yardımcısı</h2>
    <p>1. Fotoğraf seçin. 2. Çerçeveyi ayarlayıp "Kırp ve Yükle" butonuna basın. 3. Tüm linkleri kopyalayın.</p>

    <div class="controls">
        <label for="api-key">ImgBB API Anahtarı:</label>
        <input type="text" id="api-key" value="e3d614aed44fd90da549239fe760dae9" readonly>
        <input type="file" id="image-input" accept="image/*">
    </div>

    <div id="crop-container">
        <img id="source-image" src="" alt="">
        <div id="crop-frame"></div>
    </div>

    <div class="controls">
        <button id="zoom-in">Yakınlaş (+)</button>
        <button id="zoom-out">Uzaklaş (-)</button>
        <button id="upload-btn">Kırp ve Yükle</button>
    </div>

    <div class="results-container">
        <h3>Yüklenen Linkler</h3>
        <div id="results"></div>
        <button id="copy-btn">Tüm Geçerli Linkleri Kopyala</button>
    </div>

    <script>
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-input');
        const sourceImage = document.getElementById('source-image');
        const cropContainer = document.getElementById('crop-container');
        const cropFrame = document.getElementById('crop-frame');
        const uploadBtn = document.getElementById('upload-btn');
        const resultsDiv = document.getElementById('results');
        const copyBtn = document.getElementById('copy-btn');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');

        let frameState = { x: 50, y: 50, width: 150, height: 150 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function updateFramePosition() {
            cropFrame.style.left = `${frameState.x}px`;
            cropFrame.style.top = `${frameState.y}px`;
            cropFrame.style.width = `${frameState.width}px`;
            cropFrame.style.height = `${frameState.height}px`;
        }

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    sourceImage.src = event.target.result;
                    updateFramePosition();
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        cropFrame.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart.x = e.clientX - frameState.x;
            dragStart.y = e.clientY - frameState.y;
            cropFrame.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            cropFrame.style.cursor = 'move';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let newX = e.clientX - dragStart.x;
            let newY = e.clientY - dragStart.y;
            
            // Boundary checks
            frameState.x = Math.max(0, Math.min(newX, cropContainer.clientWidth - frameState.width));
            frameState.y = Math.max(0, Math.min(newY, cropContainer.clientHeight - frameState.height));
            
            updateFramePosition();
        });
        
        zoomInBtn.addEventListener('click', () => {
            frameState.width = Math.min(cropContainer.clientWidth, frameState.width + 10);
            frameState.height = Math.min(cropContainer.clientHeight, frameState.height + 10);
            updateFramePosition();
        });

        zoomOutBtn.addEventListener('click', () => {
            frameState.width = Math.max(20, frameState.width - 10);
            frameState.height = Math.max(20, frameState.height - 10);
            updateFramePosition();
        });

        uploadBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value;
            if (!apiKey) {
                alert('Lütfen ImgBB API anahtarınızı girin.');
                return;
            }
            if (!sourceImage.src) {
                alert('Lütfen bir fotoğraf seçin.');
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = frameState.width;
            canvas.height = frameState.height;

            const img = new Image();
            img.src = sourceImage.src;
            img.onload = async () => {
                const scaleX = img.naturalWidth / sourceImage.width;
                const scaleY = img.naturalHeight / sourceImage.height;
                ctx.drawImage(img, 
                    frameState.x * scaleX, frameState.y * scaleY, 
                    frameState.width * scaleX, frameState.height * scaleY, 
                    0, 0, 
                    frameState.width, frameState.height
                );

                const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
                const formData = new FormData();
                formData.append('key', apiKey);
                formData.append('image', base64Image);

                try {
                    uploadBtn.textContent = 'Yükleniyor...';
                    uploadBtn.disabled = true;
                    const response = await fetch('https://api.imgbb.com/1/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    const resultP = document.createElement('p');
                    if (data.success) {
                        resultP.textContent = `BAŞARILI: ${data.data.url}`;
                        resultP.classList.add('success');
                        resultP.dataset.url = data.data.url; // Store url for copy button
                    } else {
                        resultP.textContent = `HATA: ${data.error.message}`;
                        resultP.classList.add('error');
                    }
                    resultsDiv.appendChild(resultP);
                } catch (error) {
                    const resultP = document.createElement('p');
                    resultP.textContent = `AĞ HATASI: ${error.message}`;
                    resultP.classList.add('error');
                    resultsDiv.appendChild(resultP);
                } finally {
                    uploadBtn.textContent = 'Kırp ve Yükle';
                    uploadBtn.disabled = false;
                }
            };
        });

        copyBtn.addEventListener('click', () => {
            const links = [];
            const successes = resultsDiv.querySelectorAll('.success');
            successes.forEach(p => links.push(p.dataset.url));
            if (links.length > 0) {
                navigator.clipboard.writeText(links.join('\n')).then(() => {
                    alert('Başarılı linkler panoya kopyalandı!');
                }, () => {
                    alert('Kopyalama başarısız oldu.');
                });
            } else {
                alert('Kopyalanacak başarılı link bulunamadı.');
            }
        });
        
        updateFramePosition();

    </script>
</body>
</html>
