<header>
  <nav>
    <div class="left-nav">
      <a [routerLink]="['/yon']" class="app-title">Yöneticiler</a>
      <a [routerLink]="['/kullanicilar']" class="app-title">Kullanıcılar</a>
    </div>

    <div class="center-nav">
        @if (currentUser(); as user) {
            <span class="user-status">Giriş yapıldı</span>
        } @else {
            <span class="user-status">Giriş yapın</span>
        }
    </div>

    <div class="right-nav">
        <button (click)="login()">Giriş Yap</button>
        <button (click)="logout()">Çıkış Yap</button>
    </div>
  </nav>
</header>
